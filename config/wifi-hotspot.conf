# Configuration for /usr/local/bin/wifi-hotspot
# Uncomment and edit as needed.  See wifi-hotspot(8) for details.
#
#CLIENT="wlan0"
#AP="ap0"
#SSID="ArchHotspot"
#COUNTRY="KE"
#AP_ADDR="10.42.0.1"
#AP_PREFIX="24"
#DHCP_RANGE="10.42.0.10,10.42.0.200,12h"
#RUN_DIR="/run"
#MANAGE_FIREWALL=1   # 0 = do not touch the host firewall (nftables/iptables)
#
# How to run the hotspot:
#   auto  same-channel hostapd when the uplink's channel can host an AP,
#         otherwise a Wi-Fi Direct group owner on a channel of its own
#         (if the card and wpa_supplicant support it).  Default.
#   same  always hostapd, pinned to the uplink's channel.
#   p2p   always a Wi-Fi Direct group owner.  Experimental.
#MODE="auto"
#
# Channel for the Wi-Fi Direct group when MODE resolves to p2p:
#P2P_BAND="bg"       # bg (2.4 GHz, default ch 6) or a (5 GHz, default ch 36)
#P2P_CHANNEL="auto"  # or a channel number, e.g. 1, 6, 11, 36, 149
#
# wpa_supplicant's control-socket directory (auto-detected default):
#WPA_CTRL_DIR="/run/wpa_supplicant"
